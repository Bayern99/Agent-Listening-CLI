[project]
name = "agent-listening"
version = "1.0.0"
description = "Listening-model evidence for composed audio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.12,<0.14",
]

[project.urls]
Repository = "https://github.com/Bayern99/Agent-Listening-CLI"
Issues = "https://github.com/Bayern99/Agent-Listening-CLI/issues"

[project.scripts]
agent-listening = "agent_listening.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6,<7",
  "ruff>=0.8,<0.15",
  "mypy>=1.11,<2",
  "import-linter>=2,<3",
  "jsonschema>=4.23,<5",
  "mutmut>=2.4,<3",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv]
package = true
exclude-newer = "2026-11-08"

[tool.uv.build-backend]
module-name = "agent_listening"
module-root = "src"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ERA", "PTH"]

[tool.ruff.lint.per-file-ignores]
# eval/ E501s are long string literals (truth values, goals, docstrings) that must not be reworded
"eval/corpus.py" = ["E501"]
"eval/revise.py" = ["E501"]
"eval/run.py" = ["E501"]
"eval/score.py" = ["E501"]

[tool.mutmut]
paths_to_mutate = "src/agent_listening/evidence.py"
tests_dir = "tests"
runner = "python -m pytest -x -q tests/test_evidence.py tests/test_schema.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
strict = true
packages = ["agent_listening"]

[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

[tool.importlinter]
root_package = "agent_listening"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered modules"
type = "layers"
layers = [
  "agent_listening.cli",
  "agent_listening.tasks",
  "agent_listening.audio | agent_listening.prompts | agent_listening.gemini",
  "agent_listening.evidence",
]

[[tool.importlinter.contracts]]
name = "Heavy deps confined to audio"
type = "forbidden"
source_modules = [
  "agent_listening.evidence",
  "agent_listening.prompts",
  "agent_listening.gemini",
]
forbidden_modules = ["numpy", "soundfile"]

[[tool.importlinter.contracts]]
name = "Provider adapter is a leaf"
type = "forbidden"
source_modules = ["agent_listening.gemini"]
forbidden_modules = ["agent_listening"]

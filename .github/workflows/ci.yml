name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run lint-imports
      - run: uv run pytest -q
      - name: Build distribution
        run: uv build
      - name: Install and smoke the wheel outside the checkout
        shell: bash
        run: |
          uv venv /tmp/al-smoke-venv --python 3.11
          uv pip install --python /tmp/al-smoke-venv/bin/python dist/*.whl
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          /tmp/al-smoke-venv/bin/agent-listening --version
          /tmp/al-smoke-venv/bin/python - <<'PY'
          import numpy as np, soundfile as sf
          t = np.arange(48000) / 48000
          data = np.repeat((0.2 * np.sin(2 * np.pi * 440 * t))[:, None], 2, axis=1)
          sf.write("a.wav", data, 48000, subtype="PCM_16")
          PY
          /tmp/al-smoke-venv/bin/agent-listening identify a.wav > evidence.json
          /tmp/al-smoke-venv/bin/agent-listening compare a.wav a.wav > compare.json
          python - <<'PY'
          import json
          ev = json.load(open("compare.json"))
          assert ev["status"] == "complete", ev
          assert ev["claims"] == [], ev["claims"]
          PY
          if /tmp/al-smoke-venv/bin/agent-listening doctor; then
            echo "doctor unexpectedly ready in CI" && exit 1
          else
            code=$?
            test "$code" -eq 3
          fi
